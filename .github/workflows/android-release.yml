name: Shnayim Mikra – Build APK & Release

# Runs when the web app or Android project changes on main,
# or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases and upload assets

jobs:
  build:
    name: Build debug APK & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          DATE=$(date +'%Y-%m-%d')
          SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "shnayim-mikra-${DATE}-${SHA}.apk"
          echo "APK_NAME=shnayim-mikra-${DATE}-${SHA}.apk" >> "$GITHUB_ENV"
          echo "TAG=shnayim-mikra-apk-${DATE}-${SHA}"       >> "$GITHUB_ENV"
          echo "DATE=${DATE}"                                >> "$GITHUB_ENV"
          echo "SHA=${SHA}"                                  >> "$GITHUB_ENV"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "שניים מקרא ואחד תרגום — Android APK (${{ env.DATE }})"
          body: |
            ## Install on Android

            1. Download **`${{ env.APK_NAME }}`** below (tap the link on your phone, or transfer the file).
            2. On the phone: **Settings → Security → Install unknown apps** – enable for your browser or Files app.
            3. Tap the downloaded `.apk` and follow the installer.

            Fully offline, ad-free. Built from commit [`${{ env.SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          files: ${{ env.APK_NAME }}
          make_latest: true
