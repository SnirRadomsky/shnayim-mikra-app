name: Shnayim Mikra – Build APK & Release

# Runs when the web app or Android project changes on main,
# or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build release APK & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NAME="1.0.1"
          else
            BASE="${LATEST#v}"
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%-*}"
            PATCH=$((PATCH + 1))
            NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi
          TAG="v${NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME-preview" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode release keystore
        working-directory: android/app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${RELEASE_KEY_ALIAS:?Missing release key alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing release key password}"
          # The imported v1.0.18 APK used version code 23 in the previous repository.
          VERSION_CODE=$((23 + GITHUB_RUN_NUMBER))
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Rename APK
        run: |
          DATE=$(date +'%Y-%m-%d')
          SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/release/app-release.apk \
             "shnayim-mikra-${DATE}-${SHA}.apk"
          echo "APK_NAME=shnayim-mikra-${DATE}-${SHA}.apk" >> "$GITHUB_ENV"
          echo "TAG=${{ steps.version.outputs.tag }}"                  >> "$GITHUB_ENV"
          echo "VERSION=${{ steps.version.outputs.name }}"             >> "$GITHUB_ENV"
          echo "DATE=${DATE}"                                          >> "$GITHUB_ENV"
          echo "SHA=${SHA}"                                            >> "$GITHUB_ENV"

      - name: Upload signed preview APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-preview-apk
          path: shnayim-mikra-*.apk
          if-no-files-found: error
          retention-days: 7
