name: Shnayim Mikra – Build APK & Release

# Runs when the web app or Android project changes on main,
# or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases and upload assets

jobs:
  build:
    name: Build release APK & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          git fetch --tags --force
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            NAME="1.0.1"
          else
            BASE="${LATEST#v}"
            MAJOR="${BASE%%.*}"
            REST="${BASE#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            PATCH="${PATCH%%-*}"
            PATCH=$((PATCH + 1))
            NAME="${MAJOR}.${MINOR}.${PATCH}"
          fi
          TAG="v${NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode release keystore
        working-directory: android/app
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PVERSION_NAME=${{ steps.version.outputs.name }} \
            -PVERSION_CODE=${{ github.run_number }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Rename APK
        run: |
          DATE=$(date +'%Y-%m-%d')
          SHA=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/release/app-release.apk \
             "shnayim-mikra-${DATE}-${SHA}.apk"
          echo "APK_NAME=shnayim-mikra-${DATE}-${SHA}.apk" >> "$GITHUB_ENV"
          echo "TAG=${{ steps.version.outputs.tag }}"                  >> "$GITHUB_ENV"
          echo "VERSION=${{ steps.version.outputs.name }}"             >> "$GITHUB_ENV"
          echo "DATE=${DATE}"                                          >> "$GITHUB_ENV"
          echo "SHA=${SHA}"                                            >> "$GITHUB_ENV"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "שניים מקרא ואחד תרגום v${{ env.VERSION }} (${{ env.DATE }})"
          body: |
            ## Install / update on Android

            1. Download **`${{ env.APK_NAME }}`** below (tap the link on your phone, or transfer the file).
            2. On the phone: **Settings → Security → Install unknown apps** – enable for your browser or Files app.
            3. Tap the downloaded `.apk` and follow the installer.

            **Updating:** if you already have this app installed, Android should offer **Update** instead of asking you to uninstall first. Your reading progress and settings are kept.

            Fully offline, ad-free. Built from commit [`${{ env.SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
          files: ${{ env.APK_NAME }}
          make_latest: true
