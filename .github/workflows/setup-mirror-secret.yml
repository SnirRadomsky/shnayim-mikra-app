name: Setup mirror secret

on:
  workflow_call:
    secrets:
      MIRROR_TOKEN:
        required: true

jobs:
  set-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      secrets: write
    steps:
      - name: Store MIRROR_TOKEN on this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${{ secrets.MIRROR_TOKEN }}" | gh secret set MIRROR_TOKEN --repo "${{ github.repository }}"
